{% extends "base.html" %}

{% block title %}Đăng nhập - WebVocab{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="w3-card auth-card">
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fa-solid fa-layer-group" style="font-size: 3rem; color: #04AA6D; margin-bottom: 10px;"></i>
            <h2 style="margin: 0; color: #333;">Chào mừng trở lại</h2>
            <p style="color: #666; margin-top: 5px;">Đăng nhập để tiếp tục hành trình học từ vựng của bạn.</p>
        </div>

        <form method="POST" action="">
            {% if form %}
                {{ form.hidden_tag() }}
            {% endif %}
            
            <div class="form-group">
                <label class="form-label" for="username">Tên đăng nhập</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Nhập tên đăng nhập" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>
            
            <button type="submit" class="btn-block">Đăng nhập</button>
        </form>
        
        <p style="text-align: center; margin-top: 25px; color: #666; font-size: 0.95rem;">
            Chưa có tài khoản? <a href="{{ url_for('register') }}" style="color: #04AA6D; text-decoration: none; font-weight: bold;">Đăng ký ngay tại đây</a>.
        </p>
    </div>
</div>
{% endblock %}
